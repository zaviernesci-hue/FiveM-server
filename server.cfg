# =============================================================================
# FiveM Roleplay Server - server.cfg
# Framework: QBCore | Requires: MariaDB/MySQL, oxmysql, ox_lib, pma-voice
# =============================================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Los Santos Roleplay"
sv_maxclients 48
sv_licenseKey "changeme_your_cfx_key_here"
set steam_webApiKey "none"
sets tags "roleplay, qbcore, economy, jobs"
sets locale "en-US"

# Database (oxmysql reads these convars)
set mysql_connection_string "mysql://root:password@localhost/rp_server?charset=utf8mb4"

# Voice
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_enablePhones 1

# QBCore
setr qb_locale "en"
setr UseTarget true

# Shared config path (resources read via LoadResourceFile)
setr rp:configPath "config"

# ---------------------------------------------------------------------------
# START ORDER (dependencies first — do not reorder without reading INSTALL.md)
# ---------------------------------------------------------------------------

